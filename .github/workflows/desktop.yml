name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: npx electron-builder --linux --publish never
          - os: windows-latest
            script: npx electron-builder --win --x64 --publish never
          - os: macos-latest
            script: npx electron-builder --mac --arm64 --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${CSC_LINK}" ]; then unset CSC_LINK; fi
          if [ -z "${CSC_KEY_PASSWORD}" ]; then unset CSC_KEY_PASSWORD; fi
          ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: kovatube-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: kovatube-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          mapfile -t files < <(find release-files -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \))
          notes=$(cat <<'EOF'
          Linux AppImage, Windows installer, and macOS disk images and zip archives (Apple silicon and Intel).

          This release turns the Linux GPU back on, loads Shorts faster with five videos kept ready, and adds a Material theme plus an Apple Music now-playing screen. Opening a song from its cover shows the full player, including ambient mode, and the background follows the cover colors.

          yt-dlp and ffmpeg still need to be installed, unless you place them in the app bin folder. These macOS and Windows builds are unsigned, so Gatekeeper and SmartScreen warn the first time you open them.
          EOF
          )
          notes="$(printf '%s\n' "$notes" | sed 's/^ \{10\}//')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "Kovatube ${VERSION}" --notes "$notes"
          fi
