name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file
      - run: npm ci
      - name: Package Kovatube
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--bundles "${{ matrix.bundles }}")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npm run tauri:build -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: kovatube-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.json

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: kovatube-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          mapfile -t files < <(find release-files -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.sig' -o -name 'latest.json' \))
          notes=$(cat <<'EOF'
          This is a new Kovatube install. It does not update an Electron 1.2.0 install in place. Install this package on its own, then open it once and sign in to YouTube again.

          Settings, playlists, and downloads already in ~/.config/Kovatube stay where they are. yt-dlp and ffmpeg stay separate programs on your PATH.

          Linux AppImage and deb, Windows installer, and macOS disk image. These macOS and Windows builds are unsigned, so Gatekeeper and SmartScreen warn the first time you open them. When the TAURI_SIGNING_PRIVATE_KEY secret is set, the release also includes Tauri updater signatures for later Rust builds.
          EOF
          )
          notes="$(printf '%s\n' "$notes" | sed 's/^ \{10\}//')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "Kovatube ${VERSION}" --notes "$notes"
          fi
